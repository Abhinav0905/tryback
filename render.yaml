# Render Blueprint: one Docker web service on Render's FREE plan (no card needed) (docs/DEPLOY.md).
#
# The free plan has no persistent disk: the JSON store, photos and render cache live on an
# ephemeral disk that is wiped when the service spins down (15 min without traffic) or redeploys.
# That is acceptable for a demo: returns are short-lived anyway, and the judges' pre-warmed Clothsy
# renders are baked into the image (seed/render-cache) and restored on every start (lib/seedCache.ts).
# Cold start after a spin-down takes about a minute.
#
# For a persistent setup instead: plan: starter (paid) plus
#   disk: { name: tryback-data, mountPath: /data, sizeGB: 1 }
#
# Secrets marked `sync: false` are asked for in the dashboard when the Blueprint is applied.
services:
  - type: web
    name: tryback
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    numInstances: 1
    healthCheckPath: /api/status
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRYBACK_DATA_DIR
        value: /data
      - key: TRYON_MODE
        value: auto
      # Live renders per UTC day (the counter also resets when the ephemeral disk is wiped, so the
      # Clothsy account balance is the real ceiling). Keep it at or below the credits you have left.
      - key: DAILY_LIVE_RENDER_CAP
        value: "5"
      - key: MAX_RENDERS_PER_RETURN
        value: "5"
      - key: PHOTO_RETENTION_HOURS
        value: "24"
      - key: RENDER_RETENTION_DAYS
        value: "14"
      - key: CLOTHSY_API_KEY
        sync: false
      - key: LIVE_ACCESS_CODE
        sync: false
      - key: ADMIN_TOKEN
        sync: false
