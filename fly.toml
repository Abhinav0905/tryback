# Fly.io: ONE always-on machine with a persistent volume (docs/DEPLOY.md).
# TryBack keeps its JSON store, shopper photos and render cache on /data, and finishes renders
# in after() callbacks, so the machine must never auto-stop or scale past one.
#
#   fly launch --no-deploy --copy-config --name <your-app-name>
#   fly volumes create tryback_data --size 1 --region bom
#   fly secrets set CLOTHSY_API_KEY=... LIVE_ACCESS_CODE=... ADMIN_TOKEN=...
#   fly deploy

app = "tryback-CHANGE-ME"
primary_region = "bom"
# Let in-flight requests and background renders finish on deploys/restarts (a render can
# take up to 150 s; anything cut off is marked failed and replays from cache next time).
kill_signal = "SIGTERM"
kill_timeout = "120s"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  TRYBACK_DATA_DIR = "/data"
  # auto: live renders only for browsers that unlocked LIVE_ACCESS_CODE; everyone else replays.
  # Use "replay" for a zero-credit link (cached renders, else the labelled dev double).
  TRYON_MODE = "auto"
  # Live renders per UTC day before falling back to the labelled dev double. Keep it at or below
  # the credits you have left (npm run doctor shows the balance); 5 covers the judges' pre-warm
  # (README → Credit budget plan). Lower it, or switch TRYON_MODE to "replay", once that's done.
  DAILY_LIVE_RENDER_CAP = "5"
  MAX_RENDERS_PER_RETURN = "5"
  PHOTO_RETENTION_HOURS = "24"
  RENDER_RETENTION_DAYS = "14"

[mounts]
  source = "tryback_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/api/status"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
